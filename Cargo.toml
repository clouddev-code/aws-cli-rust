[package]
name = "awsr"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust port of the data-driven core of the AWS CLI"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "awsr"
path = "src/bin/awsr.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hex = "0.4"
hmac = "0.12"
indexmap = "2"
jmespath = "0.5"
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
ureq = "3"

# The data-driven tests evaluate ~14k endpoint rule cases and parse every
# service model; optimizing dependencies keeps plain `cargo test` usable.
[profile.dev.package."*"]
opt-level = 2
