# Follows aws-cli releases: when a newer 2.x.y tag exists, moves upstream.lock
# to it (which changes the embedded models and examples), refreshes the test
# fixtures that come from aws-cli, runs the tests and
# opens a pull request with a summary of the model changes and the upstream
# CHANGELOG. A failing test run opens a draft pull request with the log.
#
# The build job runs code fetched from aws-cli and PyPI, so it only gets a
# read-only token that is not left in the checkout. It hands its changes to
# the publish job as a patch; only publish can push and open the pull request.
#
# Requires "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General).
name: upstream-sync

on:
  schedule:
    - cron: "0 0 * * 2-6" # Tuesday to Saturday 09:00 JST
  workflow_dispatch:
    inputs:
      tag:
        description: "aws-cli release tag (default: the latest 2.x.y)"
        required: false

permissions: {}

concurrency:
  group: upstream-sync

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      branch: ${{ steps.target.outputs.branch }}
      skip: ${{ steps.target.outputs.skip }}
      status: ${{ steps.test.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide the target release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          current=$(sed -n 's/^tag *= *//p' upstream.lock)
          tag=${INPUT_TAG:-$(scripts/upstream.sh latest)}
          if ! [[ "$tag" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not an aws-cli 2.x.y release tag: $tag"
            exit 1
          fi
          branch="upstream/aws-cli-$tag"
          skip=false
          if [ "$tag" = "$current" ]; then
            echo "Already at aws-cli $tag."
            skip=true
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "Branch $branch already exists; not opening another pull request."
            skip=true
          fi
          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.target.outputs.skip == 'false'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install uv and mandoc
        if: steps.target.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mandoc
          pipx install uv

      - uses: actions/cache@v4
        if: steps.target.outputs.skip == 'false'
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
            !target/awscli-venv
            !target/sync
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Update to the release and run the tests
        id: test
        if: steps.target.outputs.skip == 'false'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          scripts/upstream.sh update "$TAG"
          scripts/upstream.sh fixtures
          set +e
          make test > target/test.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 target/test.log

      - name: Collect the changes
        if: steps.target.outputs.skip == 'false'
        run: |
          mkdir -p target/sync
          # --cached also covers new files (e.g. a new service's endpoint tests).
          git add -A upstream.lock assets/cli.json tests/fixtures
          git diff --cached --binary -- upstream.lock assets/cli.json tests/fixtures > target/sync/changes.patch
          cp target/upstream-summary.md target/test.log target/sync/

      - uses: actions/upload-artifact@v4
        if: steps.target.outputs.skip == 'false'
        with:
          name: upstream-sync
          path: target/sync
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/sync

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ needs.build.outputs.branch }}
          STATUS: ${{ needs.build.outputs.status }}
          SYNC: ${{ runner.temp }}/sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The build job ran fetched code, so check what it hands over: the
          # tag, and a patch that only edits regular files in the paths the
          # update touches (no renames, copies, mode changes or symlinks).
          if ! [[ "$TAG" =~ ^2\.[0-9]+\.[0-9]+$ ]] || [ "$BRANCH" != "upstream/aws-cli-$TAG" ]; then
            echo "::error::unexpected tag or branch: $TAG $BRANCH"
            exit 1
          fi
          allowed='^(upstream\.lock|assets/cli\.json|tests/fixtures/[^ ]+)$'
          if git apply --numstat "$SYNC/changes.patch" | cut -f3- | grep -Ev "$allowed"; then
            echo "::error::the patch touches paths outside the update"
            exit 1
          fi
          if git apply --summary "$SYNC/changes.patch" | grep -Ev '^ (create|delete) mode 100644 '; then
            echo "::error::the patch renames files or changes modes"
            exit 1
          fi
          git switch -c "$BRANCH"
          git apply --index "$SYNC/changes.patch"
          if git diff --cached --name-only | grep -Ev "$allowed"; then
            echo "::error::the applied patch touches paths outside the update"
            exit 1
          fi
          git commit -m "Update aws-cli to $TAG"
          git push origin "$BRANCH"
          {
            if [ "$STATUS" != "0" ]; then
              echo "> [!WARNING]"
              echo "> \`make test\` failed with this release. See the log at the end."
              echo
            fi
            cat "$SYNC/upstream-summary.md"
            echo
            echo "Models, paginators, waiters and examples are embedded at build time,"
            echo "so this pull request only moves \`upstream.lock\` (and \`assets/cli.json\`,"
            echo "and the test fixtures that come from aws-cli). CLI logic changes in"
            echo "the CHANGELOG (\`enhancement\`, \`feature\`, \`bugfix\` entries) are not"
            echo "picked up automatically. Run \`make fetch-upstream\` after merging."
            if [ "$STATUS" != "0" ]; then
              echo
              echo "### Test log (last 80 lines)"
              echo
              echo '```'
              tail -n 80 "$SYNC/test.log" | sed 's/```/` ` `/g'
              echo '```'
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          # GitHub limits a pull request body to 65,536 characters.
          head -c 60000 "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/pr-body-trimmed.md"
          draft=()
          if [ "$STATUS" != "0" ]; then
            draft=(--draft)
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Update aws-cli to $TAG" \
            --body-file "$RUNNER_TEMP/pr-body-trimmed.md" "${draft[@]}"

      - name: Fail when the tests failed
        if: needs.build.outputs.status != '0'
        run: exit 1
